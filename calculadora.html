	<h1>Calcular preços</h1>

    <section class="table-section">
        <table>
            <tr>
                <th>Quantidade</th>
                <th>Descrição</th>
                <th>Preço do produto</th>
                <th>Total por produto</th>
            </tr>
            <tr class="linha">
                <td><input class="quantidade" type="number" min="0" max="10" step="1" value="0"></input></td>
                <td class="nome">Poster 1</td>
                <td class="preco">10.30€</td>
                <td class="totalLinha"></td>
            </tr>
            <tr class="linha">
                <td><input class="quantidade" type="number" min="0" max="10" step="1" value="0"></input></td>
                <td class="nome">Poster 2</td>
                <td class="preco">9.99€</td>
                <td class="totalLinha"></td>
            </tr>
            <tr class="linha">
                <td><input class="quantidade" type="number" min="0" max="10" step="1" value="0"></input></td>
                <td class="nome">Poster 2</td>
                <td class="preco">39.99€</td>
                <td class="totalLinha"></td>
            </tr>
            <tr class="linha">
                <td><input class="quantidade" type="number" min="0" max="10" step="1" value="0"></input></td>
                <td class="nome">Poster 2</td>
                <td class="preco">12.99€</td>
                <td class="totalLinha"></td>
            </tr>
            <tr class="linha">
                <td><input class="quantidade" type="number" min="0" max="10" step="1" value="0"></input></td>
                <td class="nome">Poster 2</td>
                <td class="preco">4.99€</td>
                <td class="totalLinha"></td>
            </tr>
            <tr class="linha">
                <td><input class="quantidade" type="number" min="0" max="10" step="1" value="0"></input></td>
                <td class="nome">Poster 2</td>
                <td class="preco">0.45€</td>
                <td class="totalLinha"></td>
            </tr>
            <tr>
                <td class="total" colspan=4>Total: </td>
            </tr>
        </table>
        <button type="button" onclick="calcularTotal();">Calcular Total</button>
        <button type="button" onclick="limparTabela();">Limpar</button>
    </section>

	<footer>ARDC | Desafio Web Extra</footer>

    <script src="calculadora.js"></script>
